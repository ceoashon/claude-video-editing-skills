<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2); }
@font-face { font-family: Inter; font-weight: 900; src: url(fonts/inter-latin-900-normal.woff2); }
:root { --blue: #b197ff; --blue2: #7c5cff; --or: #e8825a; --ink: #0e0a1c; --soft: rgba(255,255,255,.74); }
html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
body { font-family: Inter, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; }
.abs { position: absolute; will-change: transform, opacity; }
.label { font-weight: 700; font-size: 22px; letter-spacing: .2em; text-transform: uppercase; color: var(--soft);
  text-shadow: 0 2px 16px rgba(0,0,0,.6); white-space: nowrap; }
.big { font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; line-height: .9; white-space: nowrap;
  text-shadow: 0 6px 40px rgba(0,0,0,.55); }
.blue { color: var(--blue); }
.card { background: rgba(14,10,28,.8); border: 1px solid rgba(255,255,255,.10); border-radius: 28px;
  box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.wcard { background: #fff; border-radius: 36px; box-shadow: 0 30px 90px rgba(0,0,0,.5); }
.pill { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--blue); color: #fff;
  font-weight: 900; font-size: 26px; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 10px 40px rgba(124,92,255,.5); }
.row { height: 64px; border-radius: 16px; background: rgba(255,255,255,.06); display: flex; align-items: center;
  padding: 0 22px; gap: 18px; font-weight: 700; font-size: 24px; color: rgba(255,255,255,.82); }
.row .kc { margin-left: auto; width: 70px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.14); }
.phone { border-radius: 64px; background: #0b0d14; padding: 14px; box-shadow: 0 40px 100px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.12); }
.phone .scr { width: 100%; height: 100%; border-radius: 52px; overflow: hidden; position: relative; background: #f3f4f6; }
.phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.day { width: 70px; height: 70px; border-radius: 18px; border: 2px solid rgba(255,255,255,.25); display: flex;
  align-items: center; justify-content: center; font-weight: 900; font-size: 26px; color: rgba(255,255,255,.75); }
</style></head>
<body><div id="stage"></div>
<script src="words.js"></script>
<script>
// ---------- timing helpers ----------
const norm = x => x.toLowerCase().replace(/[^a-z0-9']/g, '');
const W = (word, n = 1, sec) => {            // start time of the nth occurrence of a word
  let k = 0; word = norm(word);
  for (const x of WORDS) {
    if (sec && x.sec !== sec) continue;
    if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === word) { if (++k === n) return x.s; }
  }
  throw new Error('word not found: ' + word + ' #' + n);
};
const WE = (word, n = 1, sec) => { let k = 0; word = norm(word); for (const x of WORDS) { if (sec && x.sec !== sec) continue;
  if (x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === word && ++k === n) return x.e; } throw new Error(word); };
const END = PLAN.reduce((a, p) => a + p.frames, 0) * 1001 / 30000;
window.DURATION = END;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, t0, d) => clamp((t - t0) / d);
const eo = x => 1 - Math.pow(1 - x, 3);              // ease out cubic
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// standard in/out envelope: returns [visibility 0..1, eased-in progress]
function env(t, t0, t1, din = .35, dout = .3) {
  if (t < t0 || t > t1 + dout) return [0, 0];
  const i = eo(P(t, t0, din)), o = 1 - eio(P(t, t1, dout));
  return [Math.min(i, o), i];
}

const stage = document.getElementById('stage');
function el(html, style = {}) {
  const d = document.createElement('div'); d.className = 'abs'; d.innerHTML = html;
  Object.assign(d.style, style); stage.appendChild(d); return d;
}
function set(e, op, tx = 0, ty = 0, sc = 1, extra = '') {
  e.style.opacity = op; e.style.display = op <= 0.001 ? 'none' : 'block';
  e.style.transform = `translate(${tx}px,${ty}px) scale(${sc}) ${extra}`;
}
const blur = (e, px) => e.style.filter = px > .05 ? `blur(${px}px)` : 'none';

const cues = [];
const cue = (build, update) => { const s = build(); cues.push(t => update(t, s)); };
const LX = 150;   // left text column

window.PENDING = [];
window.seek = async t => { window.PENDING = []; for (const c of cues) c(t); await Promise.all(window.PENDING); };

</script>
